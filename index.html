    question: ` A 32-year-old primigravida presents to the antenatal clinic for her booking appointment at 8 weeks gestation. She reports that she has been taking ramipril for the past 6 months to control her blood pressure. She has a past medical history of asthma for which she uses a salbutamol inhaler occasionally. On examination, her blood pressure is 154/92 mmHg. You advise that the ramipril should be stopped immediately and alternative antihypertensives should be started, whilst awaiting specialist review.\nWhat is the most appropriate antihypertensive medication to switch this patient onto?`,
    options: ["Labetalol", "Lisinopril", "Losartan", "Nifedipine", "Spironolactone"],
    correctIndex: 3,
    explanation: `Ramipril (ACE inhibitor) is teratogenic and must be stopped. The standard first-line antihypertensives in pregnancy are Labetalol, Nifedipine, or Methyldopa. However, this patient has a history of **asthma**. Labetalol is a beta-blocker (non-selective beta/alpha antagonist) and can precipitate bronchospasm in asthmatics. Therefore, **Nifedipine** (a calcium channel blocker) is the safest and most appropriate choice among the options.`
},
{
    question: ` A 19-year-old woman has a positive pregnancy test and is found to have an ectopic pregnancy after an intrauterine pregnancy is excluded. She has no pain or other symptoms at this time. Her serum beta-human chorionic gonadotropin (B-hCG) level is 877 IU/L. A transvaginal ultrasound reveals a 24mm adnexal mass but no heartbeat. There is no free fluid in the abdomen. She is given the option of expectant management but declines this.\nWhat is the first line treatment?`,
    options: ["Methotrexate", "Urgent laparoscopic salpingectomy", "Methotrexate + urgent laparoscopic salpingectomy", "Misoprostol", "Mifepristone"],
    correctIndex: 0,
    explanation: `This patient is hemodynamically stable, asymptomatic, has a low hCG (<1500-5000 IU/L depending on guideline, 877 is low), and a small ectopic mass (<35mm) with no fetal heartbeat. She is an ideal candidate for medical management with **Methotrexate**. Since she declined expectant management, Methotrexate is the appropriate first-line intervention to avoid surgery.`
},
{
    question: ` A 27-year-old woman who is currently 39 weeks pregnant comes to see you complaining of itching down below. She has thick white discharge. Given the likely diagnosis, which one of the following treatment options would you advise?`,
    options: ["Clotrimazole pessary", "Oral fluconazole 150mg stat", "Oral fluconazole 150mg for 3 days,", "Metronidazole 400mg bd for 5 days", "Metronidazole 2g stat dose"],
    correctIndex: 0,
    explanation: `The symptoms (itch, thick white discharge) are typical of Vulvovaginal Candidiasis (Thrush). In pregnancy, **intravaginal imidazoles (like Clotrimazole pessary/cream)** are the recommended treatment. Oral azoles (Fluconazole) are generally avoided (especially high doses) due to potential teratogenic risks, although the risk is low at term, topical therapy is the standard first-line recommendation.`
},
{
    question: ` A 17-year-old girl attends her local pharmacy seeking the morning-after pill at 11 am on Tuesday. She explains she had unprotected sexual intercourse at about 10 pm on the previous Saturday night. She is not currently on any birth control and does not wish for any at present. Her friend took levonorgestrel a few weeks ago, and she makes a request for the same one. Can she have levonorgestrel as a method of emergency contraception?`,
    options: ["Yes, as it can be taken up to 72 hours later", "Yes, as it can be taken up to 120 hours later", "No, as it can only be taken up to 48 hours later. She can have ulipristal acetate, as this can be taken up to 72 hours later", "No, as it can only be taken up to 48 hours later. She can have ulipristal acetate, as this can be taken up to 120 hours later", "No, she cannot have levonorgestrel or ulipristal acetate, as these can only be taken up to 48 hours later. She can have the copper coil, as this can be taken up to 120 hours later"],
    correctIndex: 0,
    explanation: `The time elapsed from Saturday 10 pm to Tuesday 11 am is approximately 61 hours. Levonorgestrel (Levonelle) is licensed for use as emergency contraception up to **72 hours** (3 days) after unprotected sexual intercourse. Although its efficacy decreases with time, it is still within the licensed window. Ulipristal acetate (ellaOne) is effective up to 120 hours (5 days). Since the patient specifically requested levonorgestrel and is within the 72-hour window, the answer is "Yes".`
},
{
    question: ` A 43-year-old woman presents to the GP regarding contraception. She has recently entered a new relationship and is not interested in using barrier methods. Her medical history includes hypertension which is controlled with ramipril. Her periods are generally heavy and she takes tranexamic acid. The patient is comfortable taking any form of contraception and does not have any preferences except for avoiding anything that can cause weight gain. What is the most appropriate contraceptive choice?`,
    options: ["Combined oral contraceptive pill", "Depo Provera (medroxyprogesterone injection)", "Intrauterine device (copper device)", "Intrauterine system (Mirena)", "Progesterone-only pill"],
    correctIndex: 3,
    explanation: `The **Intrauterine System (Mirena)** is the most appropriate choice. It provides highly effective contraception and is the first-line treatment for heavy menstrual bleeding (menorrhagia), addressing her heavy periods. Unlike Depo Provera, the Mirena is not associated with significant weight gain. The combined oral contraceptive pill is relatively contraindicated (UKMEC 3) in women over 35 with hypertension, even if controlled. The copper IUD would likely worsen her heavy periods.`
},
{
    question: ` Which of the following is considered an unacceptable risk (UK Medical Eligibility Criteria 4 (UKMEC4)) regarding prescribing the combined oral contraceptive pill (COCP)?`,
    options: ["Personal history of migraines with no aura", "Breast feeding and 4 weeks postpartum", "Breast feeding and 7 weeks postpartum", "Family history of pulmonary embolism in a first degree relative aged <45 years old", "BMI > 35kg/m2"],
    correctIndex: 1,
    explanation: `According to WHO and older guidelines, breastfeeding <6 weeks postpartum was a Category 4 (unacceptable risk). While recent UKMEC (2016) updates have relaxed this to Category 2 for breastfeeding specifically, in the context of examination questions utilizing standard contraindications, the postpartum period (<6 weeks, especially with breastfeeding) is often flagged due to the theoretical risk of estrogen affecting milk supply and the elevated risk of VTE in the puerperium. In contrast, migraine *without* aura is UKMEC 2, family history of PE is UKMEC 2, and BMI >35 is UKMEC 3. (Note: A personal history of DVT or Migraine *with* aura would be UKMEC 4). Among the options provided, the postpartum status <6 weeks is the most significant historical contraindication cited.`
},
{
    question: ` A 35-year-old woman comes to your clinic to discuss starting contraception. Her BMI is 31 kg/m2, having lost significant weight following gastric sleeve placement 1 year ago. She is a non-smoker and has never been pregnant. Her blood pressure is 119/78mmHg. The patient is open to long-acting reversible contraceptives though doesn't want a coil. She would also like a contraceptive that can be stopped relatively quickly should she decide to want to start a family. What contraceptive option would be most appropriate?`,
    options: ["Combined hormonal contraceptive patch", "Combined oral contraceptive pill (COCP)", "Depo-Provera injectable contraceptive", "Nexplanon implantable contraceptive", "Progesterone-only pill (POP)"],
    correctIndex: 3,
    explanation: `The patient has had bariatric surgery. Oral contraceptives (COCP and POP) may have reduced effectiveness due to potential malabsorption issues, making them less ideal. The Depo-Provera injection has a delayed return to fertility (up to 12 months), which conflicts with her desire to stop quickly if she wants a family. The **Nexplanon implant** is a Long-Acting Reversible Contraceptive (LARC), is unaffected by malabsorption (bypasses the gut), is safe for her BMI, and allows for a rapid return to fertility upon removal. She specifically stated she does not want a coil, making the implant the best LARC option.`
},
{
    question: ` A 52-year-old woman presents to her general practitioner (GP) to find out the result of her recent cervical smear. Her two previous smears, taken 24 and 12 months ago, were both positive for high-risk human papillomavirus (HPV), but showed no abnormal cytology. She is informed that her most recent cervical smear was also positive for high-risk HPV.\nWhat is the most appropriate step in this patient's management?`,
    options: ["Cytological examination of the smear", "Refer for colposcopy", "Repeat cervical smear in 5 years", "Repeat cervical smear in 6 months", "Repeat cervical smear in 12 months"],
    correctIndex: 1,
    explanation: `Under the HPV primary screening program, if a patient tests HPV positive with normal cytology, the test is repeated in 12 months. If the second test is HPV positive (cytology normal), it is repeated again in another 12 months (24 months total). If the third test (at 24 months) is still **HPV positive** (regardless of cytology), the patient must be **referred for colposcopy**. This patient has now had 3 consecutive HPV positive results over a 24-month period.`
},
{
    question: ` A 62-year-old woman presents to the General Practice clinic with a three-month history of abdominal bloating, early satiety, and increasing abdominal girth. She has lost 5 kg in weight over this period. She has no significant medical history and takes no regular medications. She reached menopause at age 51 years. Her older sister was diagnosed with breast cancer at age 45 years. On examination, she appears well. Her vital signs are within normal limits. Her abdomen is distended with shifting dullness. A fixed mass is palpable in the left lower quadrant. Pelvic examination reveals a firm, irregular adnexal mass. CT abdomen/pelvis shows a complex left ovarian mass with peritoneal deposits and moderate ascites. Which one of the following is the most appropriate tumor marker to request?`,
    options: ["Alpha-fetoprotein", "CA-125", "CA 15-3", "CA 19-9", "Carcinoembryonic antigen"],
    correctIndex: 1,
    explanation: `The clinical presentation (bloating, early satiety, ascites, adnexal mass) in a postmenopausal woman is highly suspicious for **Epithelial Ovarian Cancer**. The most appropriate tumor marker for epithelial ovarian cancer is **CA-125**. AFP is for germ cell tumors (younger women), CA 19-9 is for pancreatic or mucinous ovarian tumors, and CEA is for bowel cancer.`
},
{
    question: ` A 16-year-old girl presents to the Emergency Department with a 12-hour history of nausea and lower abdominal pain associated with urinary frequency. She has regular 28-day menstrual cycles, and her last period was just over four weeks ago. She does not take any regular medications. On examination, she appears unwell. Her pulse rate is 90/min, blood pressure 112/78 mmHg, respiratory rate 18/min, Sp02 98% on room air, and temperature 37.6C. She is tender in the right iliac fossa. Which one of the following is the most appropriate next investigation?`,
    options: ["Transvaginal ultrasound", "Urinary beta-HCG", "Full blood count", "Serum beta-HCG", "Urinalysis"],
    correctIndex: 1,
    explanation: `In any woman of reproductive age presenting with lower abdominal pain, pregnancy must be excluded immediately, regardless of menstrual history. An ectopic pregnancy is a life-threatening differential diagnosis. A **Urinary beta-HCG** is the rapid, non-invasive first-line screening test. Once pregnancy status is known, further investigations (like ultrasound or bloods) can be prioritized.`
},
{
    question: ` A 24-year-old woman presents to the General Practice clinic with a three-day history of a painless genital ulcer. She reports unprotected sexual intercourse with a new partner two weeks ago. She has no significant medical history and takes no regular medications except for the combined oral contraceptive pill. On examination, she appears well with vital signs within normal limits. There is a single, well-circumscribed, non-tender ulcer with a firm base on her right labia majora. The inguinal lymph nodes are slightly enlarged but non-tender.\nWhat is the most likely diagnosis?`,
    options: ["Genital wart", "Hemophilus ducrea chancre", "Primary syphilis", "Genital herpes simplex infection", "Chlamydia infection"],
    correctIndex: 2,
    explanation: `The classic presentation of **Primary Syphilis** is a solitary, **painless**, indurated (firm base) ulcer known as a chancre, often accompanied by non-tender lymphadenopathy. Genital herpes typically presents with painful multiple vesicles/ulcers. Chancroid (*Haemophilus ducreyi*) causes painful, purulent ulcers.`
},
{
    question: ` (same previous patient) Which one of the following is the most appropriate to confirm diagnosis?`,
    options: ["Dark field microscopy", "Rapid plasma reagin test alone", "Ulcer PCR alone", "Ulcer PCR with rapid plasma reagin test", "Ulcer culture with rapid plasma reagin test"],
    correctIndex: 3,
    explanation: `Diagnosis of early (primary) syphilis can be challenging because serology may be negative in the initial stages (window period). The most sensitive and specific method for primary lesions is direct detection of *Treponema pallidum* DNA via **PCR** from a swab of the ulcer. It is standard practice to also perform serology (like **Rapid Plasma Reagin** or RPR/VDRL) to establish a baseline for monitoring treatment response, even if negative initially. Therefore, the combination of Ulcer PCR and RPR is the best approach.`
},
{
    question: ` A 68-year-old woman presents to the gynecology clinic with a six-month history of vulval itch and discomfort. She has tried over- the-counter antifungal creams without improvement. She experienced menopause at age 51 and has never used hormone replacement therapy. She has a medical history of hypertension and osteoarthritis. Her medications include amlodipine and paracetamol. She has never smoked. On examination, she appears well with vital signs within normal limits. Vulval examination reveals a 2 cm raised, white plaque on the right labium majus with surrounding erythema. There is no lymphadenopathy in the inguinal region. Which one of the following is the most appropriate next step in management?`,
    options: ["Referral for colposcopy", "Topical clotrimazole for two weeks", "Vulval biopsy in outpatient clinic", "Topical hydrocortisone for one week", "Oral fluconazole"],
    correctIndex: 2,
    explanation: `The presentation of a chronic vulval itch with a distinct "raised white plaque" (leukoplakia) in a postmenopausal woman raises the suspicion of Vulvar Intraepithelial Neoplasia (VIN) or Vulvar Cancer, in addition to Lichen Sclerosus. Antifungals have already failed. Before committing to long-term steroid treatment for Lichen Sclerosus, it is mandatory to exclude malignancy in a focal lesion. A **vulval biopsy** is the diagnostic gold standard.`
},
{
    question: ` A 45-year-old multiparous woman presents with progressively heavy menstrual bleeding for the past 6 months, associated with significant pelvic pressure and increased abdominal girth. She reports no intermenstrual bleeding or post-coital bleeding. On examination, a firm, non-tender, irregular pelvic mass consistent with an enlarged uterus is palpable, extending to 16 weeks size. Her hemoglobin is 9.8 g/dL.\nWhich of the following is the most likely diagnosis?`,
    options: ["Endometriosis", "Adenomyosis", "Uterine Leiomyoma", "Ovarian cyst"],
    correctIndex: 2,
    explanation: `The key features here are a **firm, irregular, enlarged uterus** (16 weeks size) and heavy menstrual bleeding accompanied by pressure symptoms. This is the classic presentation of **Uterine Leiomyomas (Fibroids)**. Adenomyosis typically presents with a boggy, tender, uniformly enlarged uterus (usually <12 weeks size). Ovarian cysts would present as an adnexal mass, separate from the uterus.`
},
{
    question: ` A 28-year-old nulliparous woman presents with a 3-year history of irregular menstrual cycles (occurring every 2-4 months), increasing facial hair, and persistent acne unresponsive to topical treatments. Her BMI is 32 kg/m ². Hormonal investigations reveal elevated testosterone levels and an increased LH:FSH ratio. Ultrasound shows polycystic ovaries.\nWhat is the primary underlying endocrine abnormality responsible for her symptoms?`,
    options: ["Hypothyroidism", "Hyperprolactinemia", "Insulin resistance", "Adrenal hyperplasia"],
    correctIndex: 2,
    explanation: `This patient has Polycystic Ovary Syndrome (PCOS), diagnosed by oligomenorrhea, hyperandrogenism (hirsutism/acne), and polycystic ovaries. The central pathophysiological driver in PCOS, particularly in patients with elevated BMI, is **insulin resistance**. Hyperinsulinemia stimulates theca cells to produce androgens and decreases sex hormone-binding globulin (SHBG), leading to free testosterone elevation.`
},
{
    question: ` A 22-year-old sexually active woman presents with lower abdominal pain, fever (38.5°C), and purulent vaginal discharge. On speculum examination, the cervix appears inflamed, and significant cervical motion tenderness is elicited during bimanual examination. Her urine pregnancy test is negative.\nWhat is the most appropriate initial management for this patient?`,
    options: ["Oral Metronidazole", "Intravenous Acyclovir", "Outpatient oral antibiotics for PID", "Hospitalization and broad-spectrum intravenous antibiotics"],
    correctIndex: 3,
    explanation: `The patient has clinical signs of Pelvic Inflammatory Disease (PID) (abdominal pain, CMT, discharge). However, she has signs of severe illness, specifically a **high fever (38.5°C)**. Criteria for hospitalization in PID include severe clinical illness (high fever, nausea/vomiting), pregnancy, or tubo-ovarian abscess. Due to the fever indicating systemic involvement, inpatient management with **IV antibiotics** is appropriate.`
},
{
    question: ` A 58-year-old postmenopausal woman, gravida 2, para 2, presents with a 3-month history of painless vaginal bleeding. She completed menopause 8 years ago and has not been on hormone replacement therapy. Her BMI is 35 kg/m ². Transvaginal ultrasound shows an endometrial thickness of 12 mm.\nWhich of the following is the most appropriate next step in her management?`,
    options: ["Reassurance and watchful waiting", "Oral progesterone therapy", "Endometrial biopsy", "Cervical cytology (Pap smear)"],
    correctIndex: 2,
    explanation: `Postmenopausal bleeding (PMB) is a red flag for Endometrial Cancer. An endometrial thickness > 4mm on ultrasound in a postmenopausal woman with bleeding requires tissue diagnosis. With a thickness of **12 mm**, an **endometrial biopsy** (pipelle or hysteroscopy) is mandatory to rule out hyperplasia or carcinoma.`
},
{
    question: ` A 35-year-old woman presents with severe dysmenorrhea, deep dyspareunia, and chronic pelvic pain. She has been trying to conceive for 2 years without success. Pelvic examination reveals a retroverted uterus and tender nodularity in the posterior fornix. Laparoscopy is performed.\nWhich of the following findings would most likely confirm the suspected diagnosis?`,
    options: ["Enlarged, boggy uterus", "Dilated fallopian tubes", "Blue-black lesions on the peritoneum", "Multiple uterine fibroids"],
    correctIndex: 2,
    explanation: `The symptoms (dysmenorrhea, deep dyspareunia, infertility, tender nodularity) are highly suggestive of **Endometriosis**. The diagnostic hallmark of endometriosis on laparoscopy is the presence of **"powder-burn" or blue-black lesions** (implants of endometrial tissue) on the peritoneal surfaces, ovaries, or pelvic ligaments.`
},
{
    question: ` A 25-year-old woman presents to the emergency department with sudden onset, severe, unilateral lower abdominal pain, nausea, and vomiting. Her last menstrual period was 5 weeks ago, and a urine pregnancy test is positive. On examination, she is hemodynamically stable, but a tender adnexal mass is palpable on the affected side.\nWhat is the most critical immediate investigation to perform?`,
    options: ["Abdominal X-ray", "CT scan of the abdomen and pelvis", "Transvaginal ultrasound", "Diagnostic laparoscopy"],
    correctIndex: 2,
    explanation: `The clinical picture suggests an ectopic pregnancy. The most important diagnostic imaging modality to locate the pregnancy is a **Transvaginal Ultrasound**. It can visualize the gestational sac (intrauterine vs extrauterine) and assess for free fluid. CT is contraindicated/unnecessary due to radiation, and laparoscopy is surgical management, not the initial investigation.`
},
{
    question: ` A 62-year-old woman complains of a sensation of "something coming down" in her vagina, especially when coughing or standing for prolonged periods. She also reports difficulty emptying her bladder completely. On examination, a bulge is visible at the introitus, especially with straining, involving the anterior vaginal wall.\nWhat is the most likely diagnosis?`,
    options: ["Rectocele", "Uterine prolapse", "Cystocele", "Enterocele"],
    correctIndex: 2,
    explanation: `Prolapse involving the **anterior vaginal wall** is typically a **Cystocele** (bladder prolapse). This correlates with her urinary symptoms (difficulty emptying the bladder). A rectocele involves the posterior wall, and uterine prolapse involves the apex/cervix descending.`
},
{
    question: ` A 60-year-old postmenopausal woman, who has never smoked, presents with a 6-month history of progressively worsening vulvar itching and burning. On examination, the vulvar skin appears thin, white, and parchment-like, with some architectural distortion. There are no suspicious masses or ulcers.\nWhat is the most appropriate initial management for this condition?`,
    options: ["Topical antifungal cream", "Oral antihistamines", "High-potency topical corticosteroids", "Vulvar biopsy"],
    correctIndex: 2,
    explanation: `The description of "thin, white, parchment-like" skin with architectural distortion and itching is classic for **Lichen Sclerosus**. The first-line treatment is **high-potency topical corticosteroids** (e.g., Clobetasol propionate) to reduce inflammation, relieve symptoms, and prevent further scarring/distortion. Biopsy is performed if the diagnosis is uncertain or there are suspicious lesions (masses/ulcers), but typically treatment is started on clinical grounds if classic.`
},
{
    question: ` A 29-year-old woman has been trying to conceive for 1 year with her partner. Her menstrual cycles are regular, and she has no known medical conditions. Her partner's semen analysis is normal. Hysterosalpingography reveals bilateral fallopian tube occlusion.\nWhich of the following is the most appropriate next step in her fertility management?`,
    options: ["Ovarian stimulation with Clomiphene Citrate", "Intrauterine insemination (IUI)", "In vitro fertilization (IVF)", "Laparoscopic tubal recanalization"],
    correctIndex: 2,
    explanation: `With **bilateral tubal occlusion**, sperm cannot reach the egg for fertilization in the tube, and the embryo cannot reach the uterus. Treatments like Clomiphene or IUI require at least one patent tube to function. While surgery (recanalization) is an option for sterilization reversal, for pathologic occlusion it has low success rates. **In Vitro Fertilization (IVF)** is the most appropriate and effective option as it completely bypasses the fallopian tubes.`
},
{
    question: ` A 19-year-old woman presents with severe, cramping lower abdominal pain during her menstrual periods, starting a few hours before the onset of bleeding and lasting 2-3 days. She reports no other pelvic symptoms or abnormal bleeding. Pelvic examination is unremarkable.\nWhat is the most likely diagnosis?`,
    options: ["Secondary dysmenorrhea", "Pelvic inflammatory disease (PID)", "Endometriosis", "Primary dysmenorrhea"],
    correctIndex: 3,
    explanation: `Painful menstruation beginning shortly before or at the onset of bleeding in a young woman with a normal pelvic examination and no other pathology is defined as **Primary Dysmenorrhea**. It is caused by excess prostaglandin production. Secondary dysmenorrhea implies underlying pathology (like endometriosis or fibroids) and often presents later in life or with other symptoms.`
},
{
    question: ` A 48-year-old woman presents with heavy menstrual bleeding for the past 9 months, associated with significant fatigue. Her periods are irregular, ranging from 21-35 days apart. She denies intermenstrual or post-coital bleeding. Her TSH is normal, and she is not pregnant. Pelvic ultrasound is normal.\nWhat is the most likely diagnosis in this perimenopausal woman?`,
    options: ["Endometrial hyperplasia", "Uterine fibroids", "Anovulatory dysfunctional uterine bleeding (DUB)", "Adenomyosis"],
    correctIndex: 2,
    explanation: `In the perimenopausal period, ovarian function becomes erratic, leading to anovulatory cycles. Without ovulation, there is no progesterone withdrawal, leading to unopposed estrogen and irregular, often heavy shedding of the endometrium. Since investigations (ultrasound, TSH) are normal, structural causes (fibroids, adenomyosis) are excluded. The diagnosis is **Anovulatory Dysfunctional Uterine Bleeding**.`
},
{
    question: `A 33-year-old woman undergoes a Pap smear which returns as High-Grade Squamous Intraepithelial Lesion (HSIL). Subsequent colposcopy with directed biopsies confirms Cervical Intraepithelial Neoplasia Grade 2 (CIN 2).\nWhat is the most appropriate definitive management for CIN 2?`,
    options: ["Repeat Pap smear in 6 months", "Cryotherapy or LEEP (Loop Electrosurgical Excision Procedure)", "Hysterectomy", "HPV vaccination"],
    correctIndex: 1,
    explanation: `CIN 2 and CIN 3 are considered high-grade pre-cancerous lesions requiring treatment to prevent progression to cervical cancer. The standard definitive management is excision of the transformation zone, commonly via **LEEP (Loop Electrosurgical Excision Procedure)** or LLETZ. Cryotherapy (ablation) is also an option but excision provides a specimen for histology. Hysterectomy is too radical. Observation is sometimes considered for young women (<25) with CIN 2, but at 33, treatment is standard.`
},
{
    question: ` A 26-year-old woman presents with a 2-week history of a painful, vesicular rash on her vulva, associated with dysuria and inguinal lymphadenopathy. She reports a new sexual partner recently. Examination reveals multiple small, fluid-filled blisters and shallow ulcers on the labia.\nWhat is the most likely diagnosis?`,
    options: ["Syphilis", "Genital warts (HPV)", "Genital herpes simplex virus (HSV) infection", "Chancroid"],
    correctIndex: 2,
    explanation: `The presentation of **painful**, multiple vesicles (blisters) that rupture to form shallow ulcers, often accompanied by systemic symptoms (fever) and painful lymphadenopathy, is pathognomonic for **Genital Herpes Simplex Virus (HSV)** infection. Syphilis causes painless ulcers. HPV causes fleshy warts. Chancroid causes painful ulcers but is rare and ulcers are typically larger and purulent.`
},
{
    question: `A 38-year-old woman presents with a breast lump. She has been on combined oral contraceptive pills (COCs) for 10 years. Her family history is significant for breast cancer in her mother at age 55.\nWhich of the following is an absolute contraindication to combined oral contraceptive use?`,
    options: ["History of migraine without aura", "BMI of 30 kg/m ²", "History of deep vein thrombosis (DVT)", "Family history of breast cancer"],
    correctIndex: 2,
    explanation: `A personal **history of Deep Vein Thrombosis (DVT)** is a UKMEC 4 (Absolute Contraindication) for Combined Oral Contraceptives due to the estrogen component's pro-thrombotic effect. Migraine without aura and BMI 30 are usually UKMEC 2 (benefits outweigh risks). A family history of breast cancer (unless a known gene carrier like BRCA) is usually UKMEC 1.`
},
{
    question: ` A 25-year-old woman presents with a three-day history of foul-smelling vaginal discharge. Her last menstrual period was seven days ago. A speculum examination shows a creamy-grey discharge and a swab is taken for culture. The swab is smeared onto a slide for microscopy, which shows clue cells. The vaginal pH is 5.0 (range 4.0-4.5). A fishy odor is present on addition of 10% potassium hydroxide to the vaginal fluid. Which one of the following would be the most appropriate treatment?`,
    options: ["Fluconazole", "Azithromycin", "Doxycycline", "Metronidazole", "Acetic acid vaginal gel"],
    correctIndex: 3,
    explanation: `The patient fulfills Amsel's criteria for **Bacterial Vaginosis (BV)**: 1) Homogenous grey-white discharge, 2) pH > 4.5, 3) Positive Whiff test (fishy odor with KOH), 4) Clue cells on microscopy. The standard treatment for symptomatic Bacterial Vaginosis is **Metronidazole** (oral or vaginal gel).`
},
{
    question: `A 50-year-old perimenopausal woman presents with hot flashes, night sweats, and vaginal dryness affecting her quality of life. She has an intact uterus and no contraindications to hormone therapy.\nWhat is the most appropriate hormone replacement therapy regimen for her symptoms?`,
    options: ["Estrogen-only pills", "Progestin-only pills", "Combined estrogen and progestin therapy", "Testosterone therapy"],
    correctIndex: 2,
    explanation: `In a woman with an **intact uterus**, estrogen therapy must always be combined with a **progestogen** (combined HRT) to protect the endometrium. Unopposed estrogen increases the risk of endometrial hyperplasia and cancer. Estrogen-only HRT is reserved for women who have had a hysterectomy.`
},
{
    question: ` A 20-year-old woman presents with primary amenorrhea. She has normal breast development but absent pubic and axillary hair. On examination, she has a blind-ending vagina, and no cervix or uterus are palpable. Karyotype reveals 46,XY.\nWhat is the most likely diagnosis?`,
    options: ["Turner Syndrome", "Mullerian agenesis (Rokitansky-Kuster-Hauser syndrome)", "Androgen Insensitivity Syndrome (AIS)", "Imperforate hymen"],
    correctIndex: 2,
    explanation: `This phenotype describes **Complete Androgen Insensitivity Syndrome (AIS)**. The genotype is 46,XY (male), so testes produce testosterone and Anti-Mullerian Hormone (AMH). AMH causes regression of the uterus (no uterus/cervix). However, androgen receptors are defective, so external genitalia develop as female, and testosterone is aromatized to estrogen leading to breast development. The lack of androgen response results in **absent/sparse pubic and axillary hair**. In contrast, Mullerian Agenesis has a 46,XX karyotype and normal pubic hair.`
},
{
    question: `A 70-year-old woman presents to the General Practice clinic with a six-week history of increasing urinary leakage. The leakage occurs with coughing and straining. She denies dysuria or urinary frequency. She has a medical history of chronic obstructive pulmonary disease. Her regular medications include salbutamol and inhaled corticosteroids. She maintains a well-balanced, high-fibre diet with regular bowel movements. On examination, she appears well with vital signs within normal limits. Her abdomen is soft and non-tender with no masses palpable. Vaginal examination with a chaperone reveals no visible pelvic organ prolapse. Urinalysis is negative for leukocytes and nitrites. She has previously tried pelvic floor exercises with a physiotherapist for six months without improvement.\nWhich one of the following is the most appropriate management?`,
    options: ["Oxybutynin", "Solifenacin", "Colposuspension", "Duloxetine", "Botulinum injections"],
    correctIndex: 3,
    explanation: `The patient has **Stress Urinary Incontinence** (leakage with cough/strain, no urge symptoms) and has failed first-line conservative management (pelvic floor exercises). Oxybutynin, Solifenacin, and Botox are treatments for Urge Incontinence/OAB and are not effective for stress incontinence. While surgery (like colposuspension or slings) is the standard definitive treatment, **Duloxetine** is the recommended pharmacological option for women with stress incontinence who prefer not to have surgery or are not suitable candidates. Given her COPD (chronic cough) and age, conservative medical management is a common next step in a general practice setting.`
},
{
    question: `A 27-year-old woman presents with heavy and prolonged menstrual bleeding (menorrhagia) and abdominal discomfort. Ultrasound reveals multiple uterine fibroids, with the largest measuring 7 cm. She desires future fertility.\nWhich of the following surgical options is most appropriate for her?`,
    options: ["Hysterectomy", "Uterine artery embolization (UAE)", "Endometrial ablation", "Myomectomy"],
    correctIndex: 3,
    explanation: `For a woman with symptomatic fibroids who explicitly **desires future fertility**, the surgical procedure of choice is **Myomectomy**. This involves removing the fibroids while preserving the uterus. Hysterectomy and Endometrial Ablation result in sterility. Uterine Artery Embolization (UAE) is generally not recommended for women seeking fertility due to potential risks to ovarian reserve and placentation.`
},
{
    question: ` A 65-year-old woman complains of urinary incontinence primarily when she laughs, coughs, or sneezes. She reports no urge to void or difficulty reaching the toilet. Her medical history includes three vaginal deliveries.\nWhat is the most likely type of urinary incontinence?`,
    options: ["Urge incontinence", "Overflow incontinence", "Stress incontinence", "Mixed incontinence"],
    correctIndex: 2,
    explanation: `Involuntary leakage of urine during increases in intra-abdominal pressure (laughing, coughing, sneezing) without a preceding urge is the definition of **Stress Urinary Incontinence**. It is commonly caused by urethral hypermobility or intrinsic sphincter deficiency, often associated with previous vaginal deliveries.`
},
{
    question: ` A 42-year-old woman presents with intermenstrual spotting and post-coital bleeding. Her last Pap smear was 5 years ago. On speculum examination, a friable, reddish lesion is noted on the cervix that bleeds easily on contact.\nWhat is the most appropriate initial diagnostic step?`,
    options: ["Endometrial biopsy", "Immediate cone biopsy", "Punch biopsy of the cervical lesion", "HPV DNA testing"],
    correctIndex: 2,
    explanation: `A visible, friable cervical lesion is highly suspicious for cervical cancer. In the presence of a gross lesion, Pap smears (cytology) have a high false-negative rate and are inappropriate. The correct step is to obtain a tissue diagnosis directly via a **cervical punch biopsy** to confirm malignancy.`
},
{
    question: ` A 24-year-old woman presents with a 6-month history of secondary amenorrhea. Her pregnancy test is negative. She has no hot flashes or vaginal dryness. Prolactin and TSH levels are normal. On physical examination, there are no signs of hirsutism or acne. Her BMI is 18 kg/m ². \nWhat is the most likely cause of her amenorrhea?`,
    options: ["Polycystic Ovary Syndrome (PCOS)", "Premature Ovarian Insufficiency", "Hypothalamic amenorrhea", "Asherman's Syndrome"],
    correctIndex: 2,
    explanation: `The patient has low BMI (18 kg/m2), no signs of hyperandrogenism (ruling out PCOS), and no signs of estrogen deficiency like hot flashes (making POI less likely, although FSH would confirm). In the context of low BMI and stress/exercise (implied by the phenotype), **Functional Hypothalamic Amenorrhea** is the most likely cause. This involves suppression of the GnRH pulsatility.`
},
{
    question: ` A 21-year-old woman presents with a 2-day history of sudden, severe, sharp, unilateral lower abdominal pain. She is otherwise healthy. Her last menstrual period was 2 weeks ago. Urine pregnancy test is negative. On examination, there is severe tenderness in the right adnexa. Transvaginal ultrasound shows a 5 cm right ovarian cyst with internal echoes and free fluid in the pouch of Douglas. The doppler flow to the ovary is significantly reduced.\nWhat is the most likely diagnosis?`,
    options: ["Ruptured appendicitis", "Renal colic", "Ovarian torsion", "Ectopic pregnancy"],
    correctIndex: 2,
    explanation: `The sudden onset of severe pain combined with an ovarian cyst and **reduced Doppler flow** is diagnostic for **Ovarian Torsion**. Reduced blood flow indicates ischemia, which is a surgical emergency. Ectopic is excluded by the negative pregnancy test.`
},
{
    question: ` A 34-year-old woman, G2P2, presents for a routine check-up. She desires permanent contraception. Her pregnancies and deliveries were uncomplicated. She has no significant medical history.\nWhat is the most appropriate counseling point regarding laparoscopic tubal ligation?`,
    options: ["It is 100% effective in preventing pregnancy.", "It protects against sexually transmitted infections.", "It is generally considered irreversible.", "It leads to immediate menopause."],
    correctIndex: 2,
    explanation: `Tubal ligation should be counseled as a **permanent and irreversible** method of sterilization. Reversal surgery is complex, costly, and not always successful. It is not 100% effective (failure rate ~1/200), does not protect against STIs, and does not cause menopause as the ovaries are left intact.`
},
{
    question: ` A 40-year-old woman with a history of recurrent miscarriage (3 consecutive first-trimester losses) is undergoing investigation. All routine endocrine and genetic tests are normal. Hysterosalpingography reveals an abnormality in the uterine cavity.\nWhich of the following uterine anomalies is most commonly associated with recurrent miscarriage?`,
    options: ["Unicornuate uterus", "Didelphys uterus", "Septate uterus", "Bicornuate uterus"],
    correctIndex: 2,
    explanation: `Among congenital uterine anomalies, the **Septate Uterus** is the one most strongly associated with recurrent first-trimester miscarriage. The septum is relatively avascular, leading to poor implantation and early pregnancy loss. Hysteroscopic resection of the septum significantly improves live birth rates.`
},
{
    question: ` A 20-year-old woman presents with severe nausea and vomiting since her last menstrual period, which was 8 weeks ago. On examination, her uterus appears larger than expected for gestational age. Ultrasound reveals a "snowstorm" appearance with no fetal pole. Her beta-hCG level is extremely high.\nWhat is the most likely diagnosis?`,
    options: ["Multiple pregnancy", "Missed abortion", "Hydatidiform mole", "Uterine fibroids"],
    correctIndex: 2,
    explanation: `The classic triad of hyperemesis (severe vomiting), a uterus larger than dates, and extremely high hCG is suggestive of Molar Pregnancy. The ultrasound finding of a **"snowstorm" appearance** (mixed echogenicity) without a fetus is diagnostic for a **Complete Hydatidiform Mole**.`
},
{
    question: ` A 45-year-old woman complains of new-onset episodes of involuntary urine leakage accompanied by a strong, sudden urge to urinate that she cannot suppress. These episodes occur several times a day and at night.\nWhat is the most appropriate initial management for this type of incontinence?`,
    options: ["Pelvic floor muscle exercises", "Vaginal pessary", "Anticholinergic medication", "Surgical repair"],

{
    question: ` A 26-year-old woman is referred for evaluation of infertility. She has regular menstrual cycles, but her partner's semen analysis shows severe oligoasthenoteratozoospermia. All other female investigations are normal.\nWhat is the most appropriate assisted reproductive technology (ART) for this couple?`,

{
    question: ` A 52-year-old postmenopausal woman with a history of breast cancer (estrogen receptor positive) presents with severe hot flashes and vaginal dryness significantly impacting her quality of life.\nWhich of the following is the most appropriate approach for managing her menopausal symptoms?`,

    explanation: `Systemic hormone replacement therapy (Estrogen/Progestin or Tibolone) is generally **contraindicated** in women with a history of breast cancer, especially estrogen-receptor positive tumors, as it increases the risk of recurrence. The management must rely on **non-hormonal options** (e.g., SSRIs/SNRIs for hot flashes, non-hormonal lubricants for dryness).`

{
    question: ` A 23-year-old woman presents with persistent lower abdominal pain, dyspareunia, and painful bowel movements, especially during menstruation. She also reports difficulty conceiving for 1.5 years. A rectovaginal examination reveals a fixed, tender, retroverted uterus with nodularity in the cul-de-sac.\nWhat is the most likely diagnosis?`,

},
{
    question: ` A 25-year-old woman presents with a several-month history of amenorrhea following a traumatic postpartum hemorrhage that required a manual removal of the placenta. Her prolactin and TSH levels are normal, and a progesterone challenge test fails to induce bleeding.\nWhat is the most likely diagnosis?`,
    options: ["Polycystic Ovary Syndrome (PCOS)", "Sheehan's Syndrome", "Asherman's Syndrome", "Premature Ovarian Insufficiency"],
    correctIndex: 2,
    explanation: `Secondary amenorrhea following uterine trauma (PPH/Manual removal/D&C) combined with a failure to bleed after a progesterone challenge (indicating the outflow tract is obstructed or endometrium is absent) is diagnostic of **Asherman's Syndrome** (intrauterine adhesions). Sheehan's syndrome would typically present with low pituitary hormones (low TSH, failure to lactate), but here TSH/Prolactin are normal.`
},
{
    question: ` A 32-year-old woman presents to the gynaecology clinic with her partner with concerns about difficulty conceiving for the past 18 months. She reports irregular menstrual cycles with occasional intermenstrual bleeding. She has no significant medical history and takes no regular medications. Her cervical screening test is normal and up to date. Her partner has had normal semen analysis results. On examination, she appears well with vital signs within normal limits. Investigations reveal: follicle stimulating hormone 6.2 IU/L (3.5-12.5), luteinizing hormone 4.8 IU/L (2.4-12.6), day 21 progesterone 35 nmol/L (>30), and normal thyroid function tests. Transvaginal ultrasound shows a 15 mm echogenic lesion within the endometrial cavity.\nWhich one of the following is the most appropriate next step in management?`,

{
    question: ` A 45-year-old woman with a BMI of 38 kg/m ² and a history of deep vein thrombosis (DVT) 5 years ago (provoked by surgery) complains of severe vasomotor symptoms affecting her sleep. She has a uterus.\nWhat is the safest therapeutic option for her menopausal symptoms?`,

    explanation: `Oral estrogen increases the risk of VTE and is contraindicated in women with a significant history of DVT or high BMI. **Transdermal estrogen** (patch or gel) bypasses the first-pass hepatic metabolism and does not significantly increase the risk of coagulation activation or VTE. It is the preferred route for women with VTE risk factors. Since she has a uterus, she needs progesterone; micronized progesterone is considered thromboneutral.`

{
    question: ` A 68-year-old woman presents with severe vulval itching. Examination reveals white, thinned, "cigarette paper" crinkling of the skin on the labia minora and resorption of the labial architecture. There are no distinct ulcerations. What is the most likely diagnosis?`,

    question: ` A 25-year-old woman presents with a painful, fluctuant, golf-ball-sized swelling at the 5 o'clock position of the vulva. She cannot sit comfortably. What is the most appropriate management?`,

    question: ` A 22-year-old woman presents with lower abdominal pain and deep dyspareunia. On examination, she has cervical motion tenderness and adnexal tenderness. Temperature is 37.8°C. Pregnancy test is negative. What is the most appropriate outpatient antibiotic regimen?`,

    question: ` A 20-year-old woman presents with primary amenorrhea. She has normal breast development but absent pubic and axillary hair. On examination, she has a blind-ending vagina, and no cervix or uterus are palpable. Karyotype reveals 46,XX.\nWhat is the most likely diagnosis?`,

    question: ` A 17-year-old consults you for evaluation of disabling pain with her menstrual periods. The pain has been present since menarche, and is accompanied by nausea and headache. Her medical history is otherwise unremarkable, and pelvic examination is normal. She is not currently sexually active, and she has not tried any therapy for her dysmenorrhea. What is the best treatment option for her?`,

    question: ` A 35-year-old G2P2 presents for a contraceptive counseling visit. She and her husband desire a long-term contraceptive method, and are uncertain if they want more children. She has been happily married for 10 years. Her only medical problem is mild hypertension, for which she takes a diuretic, and she has never had a sexually transmitted disease. She is considering the copper IUD and wants to know how it works. Which of the following mechanisms does not potentially contribute to the mechanism of the action of the copper IUD?`,

    let timeRemaining = 180 * 60; // 180 minutes in seconds
    let timerInterval;
    let isExamFinished = false;

    /**
     *  INITIALIZATION
     */
    window.onload = function() {
        try {
            renderPalette();
            loadQuestion(0);
            startTimer();
            updateProgress();
        } catch (e) {
            console.error("Initialization Error:", e);
            document.getElementById('q-text').textContent = "Error loading questions. Please check the data format.";
        }
    };

    /**
     *  CORE FUNCTIONS
     */

    function loadQuestion(index) {
        currentQuestionIndex = index;
        const qData = questions[index];

        // Update Header Info
        document.getElementById('q-number').textContent = `Question ${index + 1} of ${questions.length}`;
        const statusEl = document.getElementById('q-status');
        if (userAnswers[index] !== null) {
            statusEl.textContent = "Answered";
            statusEl.style.color = "var(--answered)";
        } else {
            statusEl.textContent = "Not Answered";
            statusEl.style.color = "#999";
        }

        // Render Text
        document.getElementById('q-text').textContent = qData.question;

        // Render Options (Dynamic Loop)
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = ''; // Clear previous

        qData.options.forEach((optText, optIndex) => {
            const el = document.createElement('div');
            el.className = 'option-item';
            if (userAnswers[index] === optIndex) {
                el.classList.add('selected');
            }
            
            // Allow click only if exam not finished (though logic separates views)
            if(!isExamFinished) {
                el.onclick = () => selectOption(index, optIndex);
            }

            el.innerHTML = `
                <div class="option-marker"></div>
                <div class="option-text">${optText}</div>
            `;
            optionsContainer.appendChild(el);
        });

        updatePaletteActiveState();
        updateNavButtons();
    }

    function selectOption(qIndex, optIndex) {
        userAnswers[qIndex] = optIndex;
        
        // Re-render current options to show selection
        const opts = document.querySelectorAll('.option-item');
        opts.forEach((el, i) => {
            if (i === optIndex) el.classList.add('selected');
            else el.classList.remove('selected');
        });

        // Update Status Text
        const statusEl = document.getElementById('q-status');
        statusEl.textContent = "Answered";
        statusEl.style.color = "var(--answered)";

        // Update Palette Color
        const paletteBtn = document.getElementById(`p-btn-${qIndex}`);
        paletteBtn.classList.add('answered');

        updateProgress();
    }

    function changeQuestion(delta) {
        const newIndex = currentQuestionIndex + delta;
        if (newIndex >= 0 && newIndex < questions.length) {
            loadQuestion(newIndex);
        }
    }

    function jumpToQuestion(index) {
        loadQuestion(index);
    }

    function renderPalette() {
        const container = document.getElementById('palette-container');
        container.innerHTML = '';
        
        questions.forEach((_, i) => {
            const btn = document.createElement('div');
            btn.className = 'p-btn';
            btn.id = `p-btn-${i}`;
            btn.textContent = i + 1;
            btn.onclick = () => jumpToQuestion(i);
            container.appendChild(btn);
        });
    }

    function updatePaletteActiveState() {
        document.querySelectorAll('.p-btn').forEach((btn, i) => {
            if (i === currentQuestionIndex) btn.classList.add('active');
            else btn.classList.remove('active');
        });
    }

    function updateNavButtons() {
        document.getElementById('btn-prev').disabled = currentQuestionIndex === 0;
        document.getElementById('btn-next').disabled = currentQuestionIndex === questions.length - 1;
        
        // Visual disable style
        document.getElementById('btn-prev').style.opacity = currentQuestionIndex === 0 ? '0.5' : '1';
        document.getElementById('btn-next').style.opacity = currentQuestionIndex === questions.length - 1 ? '0.5' : '1';
    }

    function updateProgress() {
        const answeredCount = userAnswers.filter(a => a !== null).length;
        document.getElementById('progress-text').textContent = `${answeredCount} / ${questions.length} Answered`;
    }

    /**
     *  TIMER LOGIC
     */
    function startTimer() {
        timerInterval = setInterval(() => {
            timeRemaining--;
            
            const hours = Math.floor(timeRemaining / 3600);
            const minutes = Math.floor((timeRemaining % 3600) / 60);
            const seconds = timeRemaining % 60;
            
            // Format HH:MM:SS or MM:SS
            let displayString = "";
            if(hours > 0) {
                 displayString = `${hours}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            } else {
                 displayString = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }

            document.getElementById('timer').textContent = displayString;

            // Panic color (last 5 mins)
            if(timeRemaining < 300) { 
                document.getElementById('timer').style.color = "#ff6b6b";
            }

            if (timeRemaining <= 0) {
                clearInterval(timerInterval);
                finishExam(true); // Force submit
            }
        }, 1000);
    }

    /**
     *  SUBMISSION & RESULTS logic
     */
    function showSubmitModal() {
        document.getElementById('submit-modal').style.display = 'flex';
    }

    function closeSubmitModal() {
        document.getElementById('submit-modal').style.display = 'none';
    }

    function finishExam(forced = false) {
        isExamFinished = true;
        clearInterval(timerInterval);
        closeSubmitModal();

        // Calculate Score
        let correctCount = 0;
        userAnswers.forEach((ans, i) => {
            if (ans === questions[i].correctIndex) {
                correctCount++;
            }
        });

        const percentage = Math.round((correctCount / questions.length) * 100);

        // Render Results Screen
        document.getElementById('quiz-view').style.display = 'none';
        document.getElementById('results-screen').style.display = 'block';

        // Update Score Header
        document.getElementById('score-display').textContent = `${percentage}%`;
        document.getElementById('score-fraction').textContent = `${correctCount} / ${questions.length}`;
        
        const passLabel = document.getElementById('pass-fail-label');
        if (percentage >= 50) {
            passLabel.textContent = "PASSED";
            passLabel.className = "pass-label pass";
        } else {
            passLabel.textContent = "FAILED";
            passLabel.className = "pass-label fail";
        }

        // Render Detailed Review
        const reviewContainer = document.getElementById('review-container');
        reviewContainer.innerHTML = '';

        questions.forEach((q, i) => {
            const userAnswer = userAnswers[i];
            const isCorrect = userAnswer === q.correctIndex;
            const itemClass = isCorrect ? 'correct' : 'incorrect';
            
            // Build Options HTML
            let optionsHTML = '';
            q.options.forEach((opt, optIdx) => {
                let optClass = 'opt-review';
                
                // Highlight logic
                if (optIdx === q.correctIndex) {
                    optClass += ' correct-answer'; // Always show correct answer
                }
                if (userAnswer === optIdx && !isCorrect) {
                    optClass += ' user-selected-wrong'; // Show if user picked wrong
                } 

                optionsHTML += `<div class="${optClass}">${opt}</div>`;
            });

            const html = `
                <div class="review-item ${itemClass}">
                    <div style="font-weight:bold; color:#555; margin-bottom:10px;">Question ${i+1}</div>
                    <div style="font-size:1.1rem; margin-bottom:1rem;">${q.question}</div>
                    <div>${optionsHTML}</div>
                    <div class="explanation-box">
                        <strong>Explanation:</strong> ${q.explanation}
                    </div>
                </div>
            `;
            reviewContainer.innerHTML += html;
        });
    }

</script>
</body>

</html>
